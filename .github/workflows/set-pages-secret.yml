name: Set Pages secret (one-off)

# Grava UMA variável de ambiente no projeto Pages sem tocar nas outras.
# O PATCH de `deployment_configs.production.env_vars` substitui o mapa inteiro
# (e o valor das secrets não volta na leitura), então mexer por ali apagaria
# Supabase/Mercado Pago/Resend. `pages secret put` mexe só na chave pedida.
on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnóstico do token de deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 whoami || true
      - name: Put CLOUDFLARE_AI_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$AI_TOKEN" | npx --yes wrangler@3 pages secret put CLOUDFLARE_AI_TOKEN --project-name=cardapio-cidadela
      - name: List secrets (nomes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages secret list --project-name=cardapio-cidadela
